dataset:
  batch_size: 32
  input_size: 128
  val_split: 0.1
  root_dir: "./datasets"
  num_workers: 2

seed: 42

model:
  in_channels: 3
  out_channels: 64
  kernel_size: 3
  padding: 1
  num_classes: 2
  stride: 1

training:
  learning_rate: 0.001
  num_epochs: 50
  patience: 10
  scheduler_factor: 0.1
  scheduler_patience: 3
  min_delta: 0.001
  save_path: "./checkpoints/best_model_final.pth"
  weight_decay: 0.00001